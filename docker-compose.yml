version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://iberian:iberian_pass@mongo:27017/iberian_chronicles?authSource=admin
      - SESSION_SECRET=change-me-to-a-random-secret
      - PORT=3000
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=iberian
      - MONGO_INITDB_ROOT_PASSWORD=iberian_pass
      - MONGO_INITDB_DATABASE=iberian_chronicles
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
  uploads_data:
